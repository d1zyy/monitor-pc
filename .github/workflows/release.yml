name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: 1.25.1

            - name: Build release 
              run: make build VERSION=${{github.ref_name}} OUTPUT=monitor-linux-amd64

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name: monitor-linux-amd64
                path: monitor-linux-amd64

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                files: monitor-linux-amd64
